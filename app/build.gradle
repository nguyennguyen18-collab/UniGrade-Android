plugins {
    id 'com.android.application'
}

android {
    namespace 'com.uef.unigrade'
    compileSdk 35

    defaultConfig {
        applicationId 'com.uef.unigrade'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
